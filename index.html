<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>النبيل بزنس | للحلول الرقمية والتسويق</title>
<link id="favicon" rel="icon" type="image/png" href="https://i.ibb.co/L5k6vzp/1000472329.png">

<style>
:root {
  --primary-blue: #0b51a1;
  --primary-gold: #d4af37;
  --dark-blue: #083871;
  --bg-color: #f8fafc;
  --card-bg: #ffffff;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
body { background: var(--bg-color); color: #1e293b; padding-bottom: 60px; }

header {
  background: linear-gradient(135deg, var(--primary-blue), var(--dark-blue));
  color: #fff;
  padding: 30px 20px;
  text-align: center;
  border-bottom: 4px solid var(--primary-gold);
}

header h1 { font-size: 1.8rem; margin-bottom: 5px; }
header p { font-size: 0.95rem; opacity: 0.9; }

.container { max-width: 1100px; margin: 30px auto; padding: 0 15px; }

/* شبكة المنتجات */
.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 20px;
}

.product-card {
  background: var(--card-bg);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  border: 1px solid #e2e8f0;
  display: flex;
  flex-direction: column;
  transition: transform 0.2s;
}

.product-card:hover { transform: translateY(-4px); }

.product-img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: #e2e8f0;
}

.product-info { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
.product-title { font-size: 1.1rem; color: var(--primary-blue); margin-bottom: 8px; font-weight: bold; }
.product-desc { font-size: 0.85rem; color: #64748b; margin-bottom: 15px; line-height: 1.5; flex-grow: 1; }

.product-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid #f1f5f9;
  padding-top: 12px;
}

.price { font-size: 1.1rem; font-weight: bold; color: var(--primary-gold); }

.btn-buy {
  background: #25d366;
  color: #fff;
  text-decoration: none;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: bold;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.loading-text { text-align: center; grid-column: 1 / -1; padding: 40px; color: #64748b; }
</style>
</head>
<body>

<header>
  <h1>النبيل بزنس 🚀</h1>
  <p>متجرك المتكامل للخدمات والتسويق والحلول الرقمية</p>
</header>

<div class="container">
  <div class="products-grid" id="products-container">
    <div class="loading-text">جاري تحميل المنتجات والخدمات... ⏳</div>
  </div>
</div>

<!-- ربط بـ Firebase لجلب المنتجات للعملاء -->
<script type="module">
  import { db } from './firebase.js';
  import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // استرجاع الشعار المخصص إذا تم تحديثه
  const savedLogo = localStorage.getItem('site_logo');
  if (savedLogo) {
    document.getElementById('favicon').href = savedLogo;
  }

  const container = document.getElementById('products-container');

  async function loadStoreProducts() {
    try {
      const querySnapshot = await getDocs(collection(db, "products"));
      container.innerHTML = '';

      if (querySnapshot.empty) {
        container.innerHTML = '<div class="loading-text">لا توجد منتجات معروضة حالياً.</div>';
        return;
      }

      querySnapshot.forEach((doc) => {
        const item = doc.data();
        const card = document.createElement('div');
        card.className = 'product-card';

        // رقم الواتساب الخاص بك للطلب المباشر (يمكنك تعديل الرقم)
        const whatsappNumber = "967770000000"; 
        const message = encodeURIComponent(`مرحباً النبيل بزنس، أود الاستفسار/طلب خدمة: ${item.title}`);
        const waLink = `https://wa.me/${whatsappNumber}?text=${message}`;

        card.innerHTML = `
          <img src="${item.img || 'https://via.placeholder.com/300x180'}" class="product-img" alt="${item.title}">
          <div class="product-info">
            <h3 class="product-title">${item.title}</h3>
            <p class="product-desc">${item.desc}</p>
            <div class="product-footer">
              <span class="price">${item.price}</span>
              <a href="${waLink}" target="_blank" class="btn-buy">طلب الخدمة 📱</a>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    } catch (e) {
      console.error("خطأ:", e);
      container.innerHTML = '<div class="loading-text" style="color:red;">عذراً، حدث خطأ أثناء تحميل المنتجات.</div>';
    }
  }

  loadStoreProducts();
</script>

</body>
</html>
