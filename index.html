<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نبيل ستور</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
color:#333;
}

header{
background:#0d6efd;
color:#fff;
padding:30px;
text-align:center;
}

header h1{
font-size:32px;
margin-bottom:10px;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#fff;
border-radius:10px;
padding:20px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
text-align:center;
}

.card h3{
margin-bottom:10px;
}

.price{
font-size:22px;
color:#0d6efd;
margin:15px 0;
font-weight:bold;
}

.btn{
display:inline-block;
padding:10px 20px;
background:#0d6efd;
color:#fff;
text-decoration:none;
border-radius:6px;
}

footer{
background:#222;
color:#fff;
text-align:center;
padding:20px;
margin-top:40px;
}
</style>

</head>
<body>

<header>
<h1>نبيل ستور</h1>
<p>متجر احترافي لبيع المنتجات الرقمية</p>
</header>

<div class="container">

<div class="products">

<div class="card">
<h3>كتاب إلكتروني</h3>
<p>تعلم التسويق الرقمي من الصفر.</p>
<div class="price">10$</div>
<a href="#" class="btn">شراء الآن</a>
</div>

<div class="card">
<h3>دورة ذكاء اصطناعي</h3>
<p>ابدأ باستخدام أدوات الذكاء الاصطناعي.</p>
<div class="price">25$</div>
<a href="#" class="btn">شراء الآن</a>
</div>

<div class="card">
<h3>قالب Canva</h3>
<p>تصاميم احترافية جاهزة للتعديل.</p>
<div class="price">5$</div>
<a href="#" class="btn">شراء الآن</a>
</div>

</div>

</div>

<footer>
© 2026 نبيل ستور - جميع الحقوق محفوظة
</footer>

</body>
  </html>
